version: '3.8'

networks:
  investigation_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

services:
  # 1. قاعدة بيانات النظام (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    container_name: investigation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_investigator
      POSTGRES_PASSWORD: ChangeThisToASecurePassword2026!
      POSTGRES_DB: investigation_system_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - investigation_network

  # 2. نظام تخزين تسجيلات الفيديو والصوت (MinIO)
  minio:
    image: quay.io/minio/minio:latest
    container_name: investigation_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin_user
      MINIO_ROOT_PASSWORD: ChangeThisToAnotherSecurePassword2026!
    ports:
      - "9000:9000"  # منفذ واجهة البرمجة (API)
      - "9001:9001"  # منفذ لوحة التحكم (Console)
    volumes:
      - minio_data:/data
    networks:
      - investigation_network